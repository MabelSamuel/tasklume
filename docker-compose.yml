# Local Postgres (with pgvector, for semantic task search) + Redis matching .env.example
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tasklume
      POSTGRES_PASSWORD: tasklume
      POSTGRES_DB: tasklume
    ports:
      # Host port is overridable (e.g. POSTGRES_PORT=5434 in .env) when a
      # system Postgres already owns 5432; keep DATABASE_URL's port in sync.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
